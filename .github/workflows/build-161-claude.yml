name: Build G6 Player Build 1.61 - native DIRECT output

on:
  workflow_dispatch:
  push:
    branches: ["claude-build-161-player"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Publish build log to branch ci-logs
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/out
          grep -nE "^e: |error:|FAILED|What went wrong|Caused by|Execution failed|Unresolved|warning: " build-log.txt | head -200 > /tmp/out/build161_errors.txt || true
          tail -150 build-log.txt > /tmp/out/build161_tail.txt
          git checkout --orphan ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/out/* .
          git add build161_errors.txt build161_tail.txt
          git commit -m "build 1.61 failure log"
          git push -f origin ci-logs
      - name: Verify APK exists and is non-empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Build 1.61 APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-Build161-v1.61.0
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct artifact link
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## Download G6HiFiPlayer Build 1.61" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Build 1.61 APK (ZIP)]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build 1.61 = pure native DIRECT output: real 24-bit for hi-res FLAC (FFmpeg pcm_s24le), no AudioTrack fallback, exclusive audio focus, hardware volume, no EQ." >> "$GITHUB_STEP_SUMMARY"
