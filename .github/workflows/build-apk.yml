name: Build G6 HiFi Player and AudioTrack Probe

on:
  workflow_dispatch:
  push:
    branches: ["build-121-audiotrack-pcm16-jack-route", "build-120-audiotrack-pcm24-direct-probe", "build-112-direct-pcm-experiment", "build-113-notification-artwork-fastpath", "build-114-transport-artwork-optimization", "build-115-artwork-lru-cache", "build-116-album-art-fastpath", "main", "build-58-audio-dependency-trim", "build-62-audio-buffer-semantics", "build-63-audio-path-evidence", "build-64-jack-unplug-notification-responsive", "build-65-widget-sync", "build-66-widget-performance-rounding", "build-67-widget-touch-debounce", "build-72-widget-touch-latency", "build-73-widget-layout-refine", "build-77-widget-4x1-responsive", "build-78-remove-songs-tab", "build-79-text-tabs-notification-responsive", "build-80-widget-composition", "build-81-widget-4x1-real-layout", "build-82-widget-minimal-controls", "build-83-widget-title-spacing", "build-84-widget-visible-spacing", "build-85-widget-contained-layout", "build-86-playback-service-stability", "build-87-playback-lifecycle-notification", "build-88-playback-stability", "build-89-service-owned-gapless", "build-90-service-owned-controls", "build-91-notification-artwork-stability", "build-109-audio-only-from-91", "build-39-smooth-queue-transition", "build-40-ui-scan-swipe-fixes", "build-41-album-queue-transition", "build-42-tabbar-swipe-player", "build-43-now-playing-ui", "build-44-ui-alignment", "build-45-statusbar-icon-centering", "build-46-header-nav-centering", "build-47-header-statusbar-all-tabs", "build-48-header-seekbar-theme-fix", "build-49-progress-thickness-header-consistency", "build-50-now-playing-metadata-header-align", "build-51-progress-thickness-header-consistency", "build-52-header-progress-polish", "build-53-now-playing-header-alignment"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APKs
        run: gradle clean assembleDebug --stacktrace
      - name: Upload AudioTrack Probe APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-Build121-AudioTrack-PCM16-Jack-Route-Probe
          path: directtest/build/outputs/apk/debug/directtest-debug.apk
      - name: Publish direct artifact link
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## Download Build 1.21 PCM16 Jack Route Probe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download AudioTrack PCM16 Jack Route Probe APK (ZIP)]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Standalone diagnostic app based on the stable Build 1.16 source line. It uses Android 9-compatible PCM16 and explicitly requests the wired headphone device. It does not replace or modify the installed G6 HiFi Player. A successful AudioTrack start or preferred route request does not prove DIRECT; verify the active track/output in dumpsys media.audio_flinger." >> "$GITHUB_STEP_SUMMARY"
