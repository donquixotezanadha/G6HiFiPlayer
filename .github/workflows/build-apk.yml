name: Build G6 HiFi Player and AAudio PCM16 Probe

on:
  workflow_dispatch:
  push:
    branches: ["build-123-aaudio-pcm16-rate-probe", "build-122-pcm24-buffer-fallback", "build-121-direct-policy-audit", "build-120-audiotrack-pcm24-direct-probe", "build-112-direct-pcm-experiment", "build-113-notification-artwork-fastpath", "build-114-transport-artwork-optimization", "build-115-artwork-lru-cache", "build-116-album-art-fastpath", "main", "build-58-audio-dependency-trim", "build-62-audio-buffer-semantics", "build-63-audio-path-evidence", "build-64-jack-unplug-notification-responsive", "build-65-widget-sync", "build-66-widget-performance-rounding", "build-67-widget-touch-debounce", "build-72-widget-touch-latency", "build-73-widget-layout-refine", "build-77-widget-4x1-responsive", "build-78-remove-songs-tab", "build-79-text-tabs-notification-responsive", "build-80-widget-composition", "build-81-widget-4x1-real-layout", "build-82-widget-minimal-controls", "build-83-widget-title-spacing", "build-84-widget-visible-spacing", "build-85-widget-contained-layout", "build-86-playback-service-stability", "build-87-playback-lifecycle-notification", "build-88-playback-stability", "build-89-service-owned-gapless", "build-90-service-owned-controls", "build-91-notification-artwork-stability", "build-109-audio-only-from-91", "build-39-smooth-queue-transition", "build-40-ui-scan-swipe-fixes", "build-41-album-queue-transition", "build-42-tabbar-swipe-player", "build-43-now-playing-ui", "build-44-ui-alignment", "build-45-statusbar-icon-centering", "build-46-header-nav-centering", "build-47-header-statusbar-all-tabs", "build-48-header-seekbar-theme-fix", "build-49-header-seekbar-theme-fix", "build-50-now-playing-metadata-header-align", "build-51-progress-thickness-header-consistency", "build-52-header-progress-polish", "build-53-now-playing-header-alignment"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform, build tools, NDK, and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APKs
        run: gradle clean assembleDebug --stacktrace
      - name: Upload AAudio PCM16 Probe APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-Build123-AAudio-PCM16-Rate-Probe
          path: directtest/build/outputs/apk/debug/directtest-debug.apk
      - name: Publish direct artifact link
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## Download Build 1.23 AAudio PCM16 Probe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download AAudio PCM16 Probe APK (ZIP)]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated native AAudio diagnostic; it does not modify the main G6HiFiPlayer playback engine. Tests PCM16 stereo at 44.1/48/96/192 kHz in EXCLUSIVE and SHARED modes, optionally requesting the currently connected wired-headphone device ID, and reports actual stream properties and xrun count. This does not prove DIRECT or bit-perfect output; inspect dumpsys media.audio_flinger." >> "$GITHUB_STEP_SUMMARY"
