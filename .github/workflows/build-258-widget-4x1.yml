name: G6HiFiPlayer Build 2.58 - true 4x1 widget

on:
  workflow_dispatch:
  push:
    branches: ["build-258-widget-4x1"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Build 2.56 baseline and 4x1 scope
        run: |
          set -euo pipefail
          BASE=a67e06dc93e113353f57e752c0a1084086951c7e
          git fetch origin "$BASE"
          git diff --exit-code "$BASE" -- app/src/main/java/id/g6hifiplayer/MainActivity.kt app/src/main/java/id/g6hifiplayer/G6Widgets.kt app/src/main/cpp app/src/main/res/layout/g6_widget_2x2.xml app/src/main/res/drawable/g6_widget_btn_square_2x2.xml app/src/main/res/drawable/g6_w_ic_play_2x2.xml app/src/main/res/drawable/g6_w_ic_pause_2x2.xml
          grep -q 'versionCode = 258' app/build.gradle.kts
          grep -q 'versionName = "2.58.0"' app/build.gradle.kts
          grep -q 'android:minHeight="70dp"' app/src/main/res/xml/g6_widget_4x2_info.xml
          grep -q 'android:minWidth="250dp"' app/src/main/res/xml/g6_widget_4x2_info.xml
          grep -q 'android:resizeMode="horizontal"' app/src/main/res/xml/g6_widget_4x2_info.xml
          grep -q 'android:layout_height="match_parent"' app/src/main/res/layout/g6_widget_4x1.xml
          grep -q 'android:layout_width="54dp"' app/src/main/res/layout/g6_widget_4x1.xml
          grep -q 'android:layout_height="54dp"' app/src/main/res/layout/g6_widget_4x1.xml
          grep -q 'android:textSize="13sp"' app/src/main/res/layout/g6_widget_4x1.xml
          grep -q 'android:textSize="10sp"' app/src/main/res/layout/g6_widget_4x1.xml
          grep -q 'android:layout_height="26dp"' app/src/main/res/layout/g6_widget_4x1.xml
          test "$(grep -c 'android:layout_width="36dp"' app/src/main/res/layout/g6_widget_4x1.xml)" -eq 3
          grep -q 'PROGRESS_CACHE_INTERVAL_MS = 5_000L' app/src/main/java/id/g6hifiplayer/G6Widgets.kt
          grep -q 'Intent.ACTION_MY_PACKAGE_REPLACED' app/src/main/java/id/g6hifiplayer/G6Widgets.kt
          echo "Scope verified: only app version, 4x1 layout/provider, and workflow differ from Build 2.56."
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK identity, native library, widget registration, and provider resource
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK bytes: $APK_BYTES"
          test "$APK_BYTES" -lt 20000000 || { echo "APK unexpectedly large; refusing artifact"; exit 1; }
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='258' versionName='2.58.0'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libg6direct.so" || { echo "libg6direct.so is missing"; exit 1; }
          unzip -l "$APK" | grep -q "res/layout/g6_widget_4x1.xml"
          unzip -l "$APK" | grep -q "res/xml/g6_widget_4x2_info.xml"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q "G6Widget4x2Provider" /tmp/manifest.txt
          grep -q "G6Widget2x2Provider" /tmp/manifest.txt
          grep -q "MY_PACKAGE_REPLACED" /tmp/manifest.txt
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-2.58.0-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-2.58.0-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
          echo "Verified source commit: $GITHUB_SHA"
      - name: Upload uniquely named Build 2.58 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-2.58.0-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact artifact link and build identity
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 2.58 - true 4x1 widget" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 2.58.0 (versionCode 258)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provider minimum height: 70dp; horizontal-only resizing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compact artwork: 54dp; controls: 36x26dp" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build 2.56 cache, playback, 2x2 widget, and native audio engine unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download this exact Build 2.58 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
