name: G6HiFiPlayer Build 2.67 - 70 percent widget opacity only

on:
  workflow_dispatch:
  push:
    branches: ["build-267-widget-opacity-70-from-266"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify only the two widget opacity values and app version changed
        run: |
          set -euo pipefail
          BASE=02bd79e93de84b1f08cbfd401856ee424b925bba
          git cat-file -e "$BASE^{commit}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD | sort)
          EXPECTED=$(printf '%s\n' app/build.gradle.kts app/src/main/res/drawable/g6_widget_bg_4x2.xml app/src/main/res/drawable/g6_widget_btn_square_2x2.xml | sort)
          test "$CHANGED" = "$EXPECTED"
          grep -q 'versionCode = 267' app/build.gradle.kts
          grep -q 'versionName = "2.67.0"' app/build.gradle.kts
          grep -q '#B3000000' app/src/main/res/drawable/g6_widget_bg_4x2.xml
          grep -q '#B3000000' app/src/main/res/drawable/g6_widget_btn_square_2x2.xml
          grep -q '#E6000000' app/src/main/res/drawable/g6_widget_btn_square_2x2.xml
          git diff --exit-code "$BASE" -- app/src/main/res/layout/g6_widget_4x1.xml app/src/main/res/layout/g6_widget_2x2.xml app/src/main/res/xml/g6_widget_4x1_info.xml app/src/main/res/xml/g6_widget_2x2_info.xml app/src/main/java/id/g6hifiplayer/G6Widgets.kt app/src/main/java/id/g6hifiplayer/MainActivity.kt app/src/main/cpp
          echo "Verified: only versionCode/versionName and the two normal widget background opacity values changed; layouts, widget dimensions, controls, playback, and cache are unchanged."
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK identity and widget registration
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK bytes: $APK_BYTES"
          test "$APK_BYTES" -lt 20000000
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='267' versionName='2.67.0'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libg6direct.so"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q "G6Widget4x2Provider" /tmp/manifest.txt
          grep -q "G6Widget2x2Provider" /tmp/manifest.txt
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-2.67.0-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-2.67.0-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
          echo "Verified source commit: $GITHUB_SHA"
      - name: Upload Build 2.67 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-2.67.0-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish build identity
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 2.67 - 70 percent widget opacity only" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: Build 2.66" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 2.67.0 (versionCode 267)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 4x1 card background: #B3000000 (70% opacity)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 2x2 button normal background: #B3000000 (70% opacity)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pressed-state feedback remains #E6000000; no other widget or player values changed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download exact Build 2.67 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
