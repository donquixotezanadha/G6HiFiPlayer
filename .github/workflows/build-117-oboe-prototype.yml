name: Build 1.17 Player + isolated Oboe probe

on:
  push:
    branches:
      - build-117-oboe-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build both APKs
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload Build 1.17 player APK
        id: player
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-Build117-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload isolated Oboe probe APK
        id: probe
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-Build117-Oboe-Probe-APK
          path: oboeprobe/build/outputs/apk/debug/oboeprobe-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish artifact links
        env:
          PLAYER_URL: ${{ steps.player.outputs.artifact-url }}
          PROBE_URL: ${{ steps.probe.outputs.artifact-url }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Build 1.17 APKs"
            echo ""
            echo "- [Download Build 1.17 player APK]($PLAYER_URL)"
            echo "- [Download separate Oboe probe APK]($PROBE_URL)"
            echo ""
            echo "Nightly links (when artifacts are published):"
            echo "- https://nightly.link/$REPOSITORY/actions/runs/$RUN_ID/G6HiFiPlayer-Build117-Player-APK.zip"
            echo "- https://nightly.link/$REPOSITORY/actions/runs/$RUN_ID/G6HiFiPlayer-Build117-Oboe-Probe-APK.zip"
            echo ""
            echo "The player remains on Media3. The separate Oboe probe outputs only a low-level 440 Hz test tone and logs requested/actual stream settings."
          } >> "$GITHUB_STEP_SUMMARY"
