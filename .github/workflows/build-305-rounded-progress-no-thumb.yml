name: G6HiFiPlayer Build 3.05 - Rounded progress without thumb

on:
  workflow_dispatch:
  push:
    branches: ["build-305-rounded-progress-no-thumb"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Build 3.05 source
        run: |
          set -euo pipefail
          grep -q 'versionCode = 305' app/build.gradle.kts
          grep -q 'versionName = "3.05"' app/build.gradle.kts
          grep -q 'thumb = null' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          grep -q 'PROGRESS_THICKNESS_DP = 4' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          grep -q 'canvas.drawRoundRect(rect, radius, radius, paint)' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          echo "Build 3.05 source checks passed."
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK identity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -lt 20000000
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='305' versionName='3.05'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libg6direct.so"
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-3.05-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-3.05-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
          echo "Verified source commit: $GITHUB_SHA"
      - name: Upload Build 3.05 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-3.05-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish build summary
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 3.05 - Rounded progress without thumb" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: Build 3.04 branch; changes limited to the Now Playing progress thumb and thickness." >> "$GITHUB_STEP_SUMMARY"
          echo "- Both Dark and Light themes: no thumb; 4dp progress track." >> "$GITHUB_STEP_SUMMARY"
          echo "- Played segment retains rounded ends, matching the track's rounded path." >> "$GITHUB_STEP_SUMMARY"
          echo "- Playback engine, layout, theme colors, widgets, and other UI values unchanged." >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "[Download exact Build 3.05 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
