name: G6HiFiPlayer Build 3.04 - White PNG progress thumb

on:
  workflow_dispatch:
  push:
    branches: ["build-304-white-png-progress-thumb-from-301"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify source provenance and thumb implementation
        run: |
          set -euo pipefail
          BASE=52ec8ed9b6e77ac822b140cc209a1c57c3d0be55
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" "$GITHUB_SHA"
          grep -q 'versionCode = 304' app/build.gradle.kts
          grep -q 'versionName = "3.04"' app/build.gradle.kts
          test -s app/src/main/res/drawable-nodpi/progress_thumb_white.png
          test "$(grep -c 'thumb = context.getDrawable(R.drawable.progress_thumb_white)' app/src/main/java/id/g6hifiplayer/MainActivity.kt)" -eq 2
          grep -q 'LIGHT_PROGRESS_TRACK_GREY' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          grep -q 'hiResBadgeShown = false' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          grep -q 'private var lightTheme = false' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          echo "Build 3.04 is based on final Build 3.01 and uses the same white PNG thumb asset in initial setup and theme updates."
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK identity and preserved registrations
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -lt 20000000
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='304' versionName='3.04'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libg6direct.so"
          unzip -l "$APK" | grep -q "res/drawable-nodpi/progress_thumb_white.png"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q "G6Widget4x2Provider" /tmp/manifest.txt
          grep -q "G6Widget2x2Provider" /tmp/manifest.txt
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-3.04-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-3.04-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
          echo "Verified source commit: $GITHUB_SHA"
      - name: Upload Build 3.04 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-3.04-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish build summary
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 3.04 - White PNG progress thumb" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: final Build 3.01, commit 52ec8ed9b6e77ac822b140cc209a1c57c3d0be55" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 3.04 (versionCode 304)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Change: replace the native tinted thumb with a white PNG asset with a subtle shadow in both theme initialization and theme switching; intrinsic asset size is fixed to 72x72 px and does not alter the SeekBar layout/padding." >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing progress track colors, Hi-Res theme-switch fix, widgets, layout, and audio code are inherited from Build 3.01." >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download exact Build 3.04 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
