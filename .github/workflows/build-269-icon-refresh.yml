name: G6HiFiPlayer Build 2.69 - app and notification icon refresh

on:
  workflow_dispatch:
  push:
    branches: ["build-269-app-icon-refresh-from-267"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Build 2.69 changes are icon-only plus version
        run: |
          set -euo pipefail
          BASE=d5ff6d3fd6bbdb23016577a178431ec36af7739b
          git cat-file -e "$BASE^{commit}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD | sort)
          EXPECTED=$(printf '%s\n' \
            .github/workflows/build-269-icon-refresh.yml \
            app/build.gradle.kts \
            app/src/main/res/drawable-nodpi/ic_launcher_foreground.png \
            app/src/main/res/drawable/ic_launcher_background.xml \
            app/src/main/res/drawable/ic_launcher_foreground.xml \
            app/src/main/res/drawable/ic_stat_music.xml \
            app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml | sort)
          test "$CHANGED" = "$EXPECTED"
          grep -q 'versionCode = 269' app/build.gradle.kts
          grep -q 'versionName = "2.69.0"' app/build.gradle.kts
          grep -q '@drawable/ic_launcher_background' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/ic_launcher_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          git diff --exit-code "$BASE" -- app/src/main/res/layout app/src/main/res/xml app/src/main/java app/src/main/cpp app/src/main/res/drawable/g6_widget_bg_4x2.xml app/src/main/res/drawable/g6_widget_btn_square_2x2.xml
          echo "Verified: Build 2.69 is based on Build 2.67; only app/notification icon resources and version identity changed."
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK identity and widget registration
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -lt 20000000
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='269' versionName='2.69.0'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libg6direct.so"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q "G6Widget4x2Provider" /tmp/manifest.txt
          grep -q "G6Widget2x2Provider" /tmp/manifest.txt
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-2.69.0-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-2.69.0-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
          echo "Verified source commit: $GITHUB_SHA"
      - name: Upload Build 2.69 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-2.69.0-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish build identity
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 2.69 - app and notification icon refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: Build 2.67 (not Build 2.68)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 2.69.0 (versionCode 269)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changes: adaptive app icon foreground/background and monochrome notification icon only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Widget layouts, providers, playback engine, and native audio code unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download exact Build 2.69 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
