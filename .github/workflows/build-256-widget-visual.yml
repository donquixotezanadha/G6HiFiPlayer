name: G6HiFiPlayer Build 2.56 - widget visual polish

on:
  workflow_dispatch:
  push:
    branches: ["build-256-widget-visual-polish"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Build 2.56 source
        uses: actions/checkout@v4
        with:
          ref: build-256-widget-visual-polish
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Build 2.55 baseline and widget-only scope
        run: |
          set -euo pipefail
          git fetch origin 60b6ea9b934f3a615bb56d48232892faa2c57434
          git diff --exit-code 60b6ea9b934f3a615bb56d48232892faa2c57434 -- app/src/main/java/id/g6hifiplayer/MainActivity.kt app/src/main/java/id/g6hifiplayer/G6Widgets.kt app/src/main/cpp
          grep -q 'versionCode = 256' app/build.gradle.kts
          grep -q 'versionName = "2.56.0"' app/build.gradle.kts
          grep -q 'android:textSize="16sp"' app/src/main/res/layout/g6_widget_4x1.xml
          grep -q 'android:textSize="12sp"' app/src/main/res/layout/g6_widget_4x1.xml
          grep -q 'android:layout_width="56dp"' app/src/main/res/layout/g6_widget_2x2.xml
          grep -q 'android:layout_marginStart="14dp"' app/src/main/res/layout/g6_widget_2x2.xml
          grep -q 'android:layout_marginBottom="14dp"' app/src/main/res/layout/g6_widget_2x2.xml
          grep -q '#CC000000' app/src/main/res/drawable/g6_widget_btn_square_2x2.xml
          grep -q 'android:fillColor="#FFFFFFFF"' app/src/main/res/drawable/g6_w_ic_play_2x2.xml
          grep -q 'android:fillColor="#FFFFFFFF"' app/src/main/res/drawable/g6_w_ic_pause_2x2.xml
          grep -q 'PROGRESS_CACHE_INTERVAL_MS = 5_000L' app/src/main/java/id/g6hifiplayer/G6Widgets.kt
          grep -q 'Intent.ACTION_MY_PACKAGE_REPLACED' app/src/main/java/id/g6hifiplayer/G6Widgets.kt
          echo "Only widget visual resources and version changed; cache, player logic, and native audio engine preserved."
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK identity, size, native library, and widget registration
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK bytes: $APK_BYTES"
          test "$APK_BYTES" -lt 20000000 || { echo "APK unexpectedly large; refusing artifact"; exit 1; }
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='256' versionName='2.56.0'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libg6direct.so" || { echo "libg6direct.so is missing"; exit 1; }
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q "G6Widget4x2Provider" /tmp/manifest.txt
          grep -q "G6Widget2x2Provider" /tmp/manifest.txt
          grep -q "MY_PACKAGE_REPLACED" /tmp/manifest.txt
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-2.56.0-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-2.56.0-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
          echo "Verified source commit: $GITHUB_SHA"
      - name: Upload uniquely named Build 2.56 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-2.56.0-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact artifact link and build identity
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 2.56 - widget visual polish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 2.56.0 (versionCode 256)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- 4x2 title/artist font reduced to 16sp/12sp" >> "$GITHUB_STEP_SUMMARY"
          echo "- 2x2 play/pause button enlarged to 56dp, aligned to artwork left edge" >> "$GITHUB_STEP_SUMMARY"
          echo "- Solid icons and 80% black rounded background" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache, player logic, and native audio engine unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download this exact Build 2.56 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
