name: Build 2.51 - Compact Widget Controls

on:
  push:
    branches:
      - build-251-compact-widget-controls
    paths:
      - '.github/workflows/build-251-compact-widget-controls.yml'
      - 'app/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build 2.51 source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Rename APK for Build 2.51
        run: cp app/build/outputs/apk/debug/app-debug.apk G6HiFiPlayer-Build-2.51-debug.apk

      - name: Upload Build 2.51 APK
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-Build-2.51-debug-apk
          path: G6HiFiPlayer-Build-2.51-debug.apk
          if-no-files-found: error
