name: Build G6 Engine Lab Build 1.29 - PCM Playback Fix + Text Diagnostics

on:
  workflow_dispatch:
  push:
    branches: ["build-129-pcm-writer-stability"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify FFmpeg runtime dependency
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath > runtime-dependencies.txt
          grep -F "dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.8" runtime-dependencies.txt
          grep -F "com.arthenica:smart-exception-java:0.2.1" runtime-dependencies.txt
          cat runtime-dependencies.txt | grep -E "ffmpeg-kit-audio|smart-exception-java"
      - name: Build debug APK
        run: gradle --refresh-dependencies clean assembleDebug --stacktrace
      - name: Verify APK exists and is non-empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Build 1.29 Engine Lab APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-Build129-PCM-Writer-Stability
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct artifact link
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## Download G6 Engine Lab Build 1.29" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Build 1.29 Engine Lab APK (ZIP)]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Hardens PCM writer cancellation and frame-aligned writes, reports ongoing writer/playback-head progress, and fixes Build 1.29 playback completion/error UI handling." >> "$GITHUB_STEP_SUMMARY"
