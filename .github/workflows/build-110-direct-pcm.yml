name: Build 1.10 DIRECT PCM experiment

on:
  push:
    branches:
      - build-110-direct-pcm-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-1.10.0-direct-pcm-experiment
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
