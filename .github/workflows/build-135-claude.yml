name: Build G6 Engine Lab Build 1.35 - Claude pipeline

on:
  workflow_dispatch:
  push:
    branches: ["claude-build-135"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace
      - name: Verify APK exists and is non-empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Build 1.35 Engine Lab APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6-Engine-Lab-Build135-v1.35.0
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct artifact link
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## Download G6 Engine Lab Build 1.35" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Build 1.35 APK (ZIP)]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build 1.35 tries a 24-bit packed DIRECT-capable AudioTrack (UAPP format) for 24-bit sources; falls back to float." >> "$GITHUB_STEP_SUMMARY"
