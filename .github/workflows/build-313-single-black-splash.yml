name: G6HiFiPlayer Build 3.13 - single black splash

on:
  workflow_dispatch:
  push:
    branches: ["build-313-single-black-splash"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Build 3.13 identity and scope
        run: |
          set -euo pipefail
          BASE=b84a7a3bb7c19a240aac63d43bea2fffee0ce4f5
          git cat-file -e "$BASE^{commit}"
          grep -q 'versionCode = 313' app/build.gradle.kts
          grep -q 'versionName = "3.13"' app/build.gradle.kts
          grep -q 'android:name="id.g6hifiplayer.MainActivity"' app/src/main/AndroidManifest.xml
          grep -q '<category android:name="android.intent.category.LAUNCHER" />' app/src/main/AndroidManifest.xml
          ! grep -q 'activity-alias' app/src/main/AndroidManifest.xml
          ! grep -q 'MainActivityDark\|MainActivityLight\|syncLauncherTheme' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          grep -q '<item name="android:windowBackground">#FF000000</item>' app/src/main/res/values/styles.xml
          grep -q 'setBackgroundColor(DARK_SURFACE)' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          git diff --exit-code "$BASE"...HEAD -- app/src/main/cpp app/src/main/res/layout app/src/main/res/xml app/src/main/res/drawable-nodpi/ic_launcher_foreground_original.png
          echo "Build 3.13 scope verified: one launcher activity, no theme aliases, black starting window and black in-app splash."
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='313' versionName='3.13'"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'id.g6hifiplayer.MainActivity' /tmp/manifest.txt
          ! grep -q 'MainActivityDark\|MainActivityLight' /tmp/manifest.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libg6direct.so'
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-3.13-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-3.13-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
      - name: Upload Build 3.13 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-3.13-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish build identity
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 3.13 - Single black splash" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exactly one launcher activity; removed the two theme activity-alias entries and runtime alias switching." >> "$GITHUB_STEP_SUMMARY"
          echo "- Android starting window is plain black; the existing in-app splash alone displays the foreground logo on black." >> "$GITHUB_STEP_SUMMARY"
          echo "- Saved Light/Dark preference still selects the actual app theme after startup." >> "$GITHUB_STEP_SUMMARY"
          echo "- Splash logo asset and size, widgets, playback engine, native audio, and cache are unchanged." >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download exact Build 3.13 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
