name: G6HiFiPlayer Build 3.00 - light theme and widget palette

on:
  workflow_dispatch:
  push:
    branches: ["build-300-light-theme-from-272"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Build 3.00 identity
        run: |
          set -euo pipefail
          BASE=4cede8658150ca789bc3300d98b10e06eb831c3e
          git cat-file -e "$BASE^{commit}"
          grep -q 'versionCode = 300' app/build.gradle.kts
          grep -q 'versionName = "3.00"' app/build.gradle.kts
          grep -q 'private var lightTheme = false' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          grep -q 'g6_widget_bg_4x2_light' app/src/main/java/id/g6hifiplayer/G6Widgets.kt
          echo "Build 3.00 source verified as based on Build 2.72."
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK identity and widget registration
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -lt 20000000
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='300' versionName='3.00'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libg6direct.so"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q "G6Widget4x2Provider" /tmp/manifest.txt
          grep -q "G6Widget2x2Provider" /tmp/manifest.txt
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-3.00-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-3.00-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
          echo "Verified source commit: $GITHUB_SHA"
      - name: Upload Build 3.00 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-3.00-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish build identity
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 3.00 - Light Theme" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: Build 2.72 (commit 4cede8658150ca789bc3300d98b10e06eb831c3e)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 3.00 (versionCode 300)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Theme: light blurred album-art backdrop, dark text, slightly darker muted text; purple accent unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Widgets follow the selected theme; dimensions and layout geometry unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Playback and native audio code unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download exact Build 3.00 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
