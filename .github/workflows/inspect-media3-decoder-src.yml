name: Inspect Media3 decoder sources (Hifi 1.27 prep)

on:
  workflow_dispatch:
  push:
    branches: ["hifi-v1-27"]
    paths: [".github/workflows/inspect-media3-decoder-src.yml"]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Media3 1.10.1 source jars
        run: |
          mkdir -p work/src && cd work
          for m in exoplayer extractor common decoder; do
            curl -fsSL -o $m.jar https://dl.google.com/dl/android/maven2/androidx/media3/media3-$m/1.10.1/media3-$m-1.10.1-sources.jar || echo "missing $m"
            [ -s $m.jar ] && unzip -q -o $m.jar -d src/$m || true
          done
          mkdir -p ../out
          A=src/exoplayer/androidx/media3/exoplayer
          cp $A/audio/DecoderAudioRenderer.java $A/audio/AudioSink.java $A/audio/DefaultAudioSink.java ../out/ 2>&1 || true
          cp $A/audio/AudioRendererEventListener.java $A/audio/AudioCapabilities.java ../out/ 2>&1 || true
          cp src/decoder/androidx/media3/decoder/SimpleDecoder.java src/decoder/androidx/media3/decoder/DecoderInputBuffer.java \
             src/decoder/androidx/media3/decoder/SimpleDecoderOutputBuffer.java src/decoder/androidx/media3/decoder/DecoderException.java \
             src/decoder/androidx/media3/decoder/Decoder.java ../out/ 2>&1 || true
          cp $A/DefaultRenderersFactory.java $A/BaseRenderer.java $A/RendererCapabilities.java ../out/ 2>&1 || true
          find src -name 'FlacStreamMetadata.java' -o -name 'FlacExtractor.java' -o -name 'FlacFrameReader.java' | xargs -I{} cp {} ../out/ || true
          ls -l ../out
      - name: Publish to branch ci-logs
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/out && cp out/* /tmp/out/
          git checkout --orphan ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p media3src && cp /tmp/out/* media3src/
          git add media3src
          git commit -m "media3 1.10.1 decoder sources"
          git push -f origin ci-logs
