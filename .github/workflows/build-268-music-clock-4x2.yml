name: G6HiFiPlayer Build 2.68 - Music + Clock 4x2

on:
  workflow_dispatch:
  push:
    branches: ["build-268-music-clock-4x2"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Audit Build 2.68 scope and widget registration
        run: |
          set -euo pipefail
          BASE=d5ff6d3fd6bbdb23016577a178431ec36af7739b
          git cat-file -e "$BASE^{commit}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD | sort)
          EXPECTED=$(printf '%s\n' \
            .github/workflows/build-268-music-clock-4x2.yml \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/id/g6hifiplayer/G6Widgets.kt \
            app/src/main/res/drawable/g6_widget_bg_2x2.xml \
            app/src/main/res/layout/g6_widget_music_clock_4x2.xml \
            app/src/main/res/xml/g6_widget_music_clock_4x2_info.xml | sort)
          test "$CHANGED" = "$EXPECTED"
          grep -q 'versionCode = 268' app/build.gradle.kts
          grep -q 'versionName = "2.68.0"' app/build.gradle.kts
          grep -q 'android:label="Music 4x2"' app/src/main/AndroidManifest.xml
          grep -q 'android:label="Music + Clock 4x2"' app/src/main/AndroidManifest.xml
          grep -q 'G6WidgetMusicClock4x2Provider' app/src/main/AndroidManifest.xml
          grep -q 'g6_widget_music_clock_4x2_info' app/src/main/AndroidManifest.xml
          grep -q 'android:minHeight="170dp"' app/src/main/res/xml/g6_widget_music_clock_4x2_info.xml
          grep -q 'android:format24Hour="HH:mm"' app/src/main/res/layout/g6_widget_music_clock_4x2.xml
          grep -q 'android:textSize="40sp"' app/src/main/res/layout/g6_widget_music_clock_4x2.xml
          grep -q '#B3000000' app/src/main/res/drawable/g6_widget_bg_2x2.xml
          grep -q '#B3000000' app/src/main/res/drawable/g6_widget_bg_4x2.xml
          grep -q '#B3000000' app/src/main/res/drawable/g6_widget_btn_square_2x2.xml
          grep -q '#E6000000' app/src/main/res/drawable/g6_widget_btn_square_2x2.xml
          git diff --exit-code "$BASE" -- app/src/main/res/layout/g6_widget_4x1.xml app/src/main/res/layout/g6_widget_2x2.xml app/src/main/res/xml/g6_widget_4x1_info.xml app/src/main/res/xml/g6_widget_2x2_info.xml app/src/main/res/drawable/g6_widget_bg_4x2.xml app/src/main/res/drawable/g6_widget_btn_square_2x2.xml app/src/main/java/id/g6hifiplayer/MainActivity.kt app/src/main/cpp
          echo "Verified Build 2.68 scope: new Music + Clock widget, legacy label correction, 70% black 2x2 background, version bump. Existing widget layouts and playback engine remain unchanged."
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK identity and widget registration
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK bytes: $APK_BYTES"
          test "$APK_BYTES" -lt 20000000
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='268' versionName='2.68.0'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libg6direct.so"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q "G6Widget4x2Provider" /tmp/manifest.txt
          grep -q "G6WidgetMusicClock4x2Provider" /tmp/manifest.txt
          grep -q "G6Widget2x2Provider" /tmp/manifest.txt
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-2.68.0-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-2.68.0-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
          echo "Verified source commit: $GITHUB_SHA"
      - name: Upload Build 2.68 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-2.68.0-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish build identity
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 2.68 - Music + Clock 4x2" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: Build 2.67 commit d5ff6d3fd6bbdb23016577a178431ec36af7739b" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 2.68.0 (versionCode 268)" >> "$GITHUB_STEP_SUMMARY"
          echo "- New widget: Music + Clock 4x2; music card above, large white system-font clock and date below, left aligned" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing compact Music widget label corrected to Music 4x2; layout/provider dimensions preserved" >> "$GITHUB_STEP_SUMMARY"
          echo "- Widget backgrounds: 70% black (#B3000000); pressed button state remains #E6000000" >> "$GITHUB_STEP_SUMMARY"
          echo "- Playback engine and MainActivity unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download exact Build 2.68 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"