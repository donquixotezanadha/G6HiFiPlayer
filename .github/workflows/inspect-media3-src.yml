name: Inspect Media3 sources (Build 1.62 prep)

on:
  workflow_dispatch:
  push:
    branches: ["claude-build-162-player"]
    paths: [".github/workflows/inspect-media3-src.yml"]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Media3 1.10.1 sources
        run: |
          mkdir -p work/src && cd work
          for a in media3-exoplayer media3-extractor media3-common; do
            curl -fsSL -o $a.jar https://dl.google.com/dl/android/maven2/androidx/media3/$a/1.10.1/$a-1.10.1-sources.jar || echo "no sources for $a"
            [ -f $a.jar ] && unzip -q -o $a.jar -d src/$a || true
          done
          mkdir -p /tmp/out
          cp "$(find src -name DefaultAudioSink.java | head -1)" /tmp/out/DefaultAudioSink.java
          cp "$(find src -name AudioOutputProvider.java | head -1)" /tmp/out/AudioOutputProvider.java
          cp "$(find src -name AudioOutput.java | head -1)" /tmp/out/AudioOutput.java
          cp "$(find src -name MediaCodecAudioRenderer.java | head -1)" /tmp/out/MediaCodecAudioRenderer.java
          cp "$(find src -name WavHeaderReader.java | head -1)" /tmp/out/WavHeaderReader.java
          cp "$(find src -name DefaultLoadControl.java | head -1)" /tmp/out/DefaultLoadControl.java
          ls -la /tmp/out
      - name: Publish to branch ci-logs
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/out/* .
          git add *.java
          git commit -m "media3 sources for 1.62 prep"
          git push -f origin ci-logs
