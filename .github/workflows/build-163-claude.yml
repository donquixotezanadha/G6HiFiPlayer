name: Build 163 - G6HiFiPlayer

on:
  push:
    branches:
      - claude-build-163-player
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-163-claude.yml"
      - "BUILD163_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle clean assembleDebug --stacktrace 2>&1 | tee build-163.log

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          echo "Verified APK: $APK ($(stat -c%s "$APK") bytes)"

      - name: Upload debug APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-Build163-v1.63.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish artifact link to summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## G6HiFiPlayer Build 1.63.0"
            echo ""
            echo "- **Status:** Success"
            echo "- **Artifact:** [G6HiFiPlayer-Build163-v1.63.0]($ARTIFACT_URL)"
            echo "- **APK:** `app/build/outputs/apk/debug/app-debug.apk`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save failure log to ci-logs branch
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          if [ ! -s build-163.log ]; then
            printf 'Build failed before Gradle produced a log. Inspect the failed GitHub Actions steps for details.\n' > build-163.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin ci-logs
          if git show-ref --verify --quiet refs/remotes/origin/ci-logs; then
            git checkout -B ci-logs origin/ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf . >/dev/null 2>&1
          fi
          mkdir -p logs
          cp "$GITHUB_WORKSPACE/build-163.log" "logs/build-163-${GITHUB_RUN_ID}.log"
          git add "logs/build-163-${GITHUB_RUN_ID}.log"
          git commit -m "Save Build 163 CI failure log (${GITHUB_RUN_ID})"
          git push origin ci-logs
