name: G6HiFiPlayer Build 3.18 - fixed-height 4x2 widget card

on:
  workflow_dispatch:
  push:
    branches: ["build-318-widget-fixed-card-height"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Build 3.18 widget-card scope
        run: |
          set -euo pipefail
          BASE=b84a7a3bb7c19a240aac63d43bea2fffee0ce4f5
          git cat-file -e "$BASE^{commit}"
          grep -q 'versionCode = 318' app/build.gradle.kts
          grep -q 'versionName = "3.18"' app/build.gradle.kts
          grep -q 'android:layout_height="70dp"' app/src/main/res/layout/g6_widget_4x1.xml
          test "$(grep -c 'android:paddingStart="8dp"\|android:paddingEnd="8dp"' app/src/main/res/layout/g6_widget_4x1.xml)" -eq 2
          test "$(grep -c 'android:windowDisablePreview">true' app/src/main/res/values/styles.xml)" -eq 2
          if grep -q 'activity-alias' app/src/main/AndroidManifest.xml; then echo "Unexpected: activity-alias in app/src/main/AndroidManifest.xml"; exit 1; fi
          test "$(grep -c 'android.intent.category.LAUNCHER' app/src/main/AndroidManifest.xml)" -eq 1
          if grep -q 'setComponentEnabledSetting' app/src/main/java/id/g6hifiplayer/MainActivity.kt; then echo "Unexpected: setComponentEnabledSetting in app/src/main/java/id/g6hifiplayer/MainActivity.kt"; exit 1; fi
          if grep -q 'syncLauncherThemeAlias' app/src/main/java/id/g6hifiplayer/MainActivity.kt; then echo "Unexpected: syncLauncherThemeAlias in app/src/main/java/id/g6hifiplayer/MainActivity.kt"; exit 1; fi
          grep -q 'setImageResource(R.drawable.ic_launcher_foreground_original)' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          grep -q 'FrameLayout.LayoutParams(dp(112), dp(112), Gravity.CENTER)' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          grep -q 'setBackgroundColor(if (lightTheme) LIGHT_SURFACE else DARK_SURFACE)' app/src/main/java/id/g6hifiplayer/MainActivity.kt
          ! grep -q 'window_splash_light\|window_splash_dark' app/src/main/res/values/styles.xml
          test ! -e app/src/main/res/drawable/window_splash_light.xml
          test ! -e app/src/main/res/drawable/window_splash_dark.xml
          git diff --exit-code "$BASE"...HEAD -- app/src/main/cpp app/src/main/res/xml app/src/main/res/drawable-nodpi/ic_launcher_foreground_original.png
          echo "Build 3.18 scope verified: single launcher entry kept, 4x2 widget card has a fixed 70dp height, engine/xml/logo untouched."
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='318' versionName='3.18'"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          if grep -q 'MainActivityDark\|MainActivityLight' /tmp/manifest.txt; then echo "Unexpected: MainActivityDark\|MainActivityLight in /tmp/manifest.txt"; exit 1; fi
          test "$(grep -c 'android.intent.category.LAUNCHER' /tmp/manifest.txt)" -eq 1
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libg6direct.so'
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-3.18-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-3.18-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
      - name: Upload Build 3.18 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-3.18-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish build identity
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 3.18 - Fixed-height 4x2 widget card" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- The 4x2 widget card now has a fixed 70dp height, centred in the area the launcher gives, with equal 8dp padding around the cover and text (same look on LG and Nova)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Android's separate launch preview stays disabled; the app keeps one in-app splash (112dp foreground logo)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Splash background follows the saved theme: light #F8F8FC, dark black." >> "$GITHUB_STEP_SUMMARY"
          echo "- Playback engine, native audio, widgets, cache, and logo assets are unchanged." >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download exact Build 3.18 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
