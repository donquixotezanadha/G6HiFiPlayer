name: G6HiFiPlayer Build 2.53 - verified artifact from stable 2.48

on:
  workflow_dispatch:
  push:
    branches: ["build-253-from-248-widget-runtime-fix"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Build 2.48 baseline branch
        uses: actions/checkout@v4
        with:
          ref: build-253-from-248-widget-runtime-fix
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify player/audio engine is unchanged from Build 2.48 baseline
        run: |
          set -euo pipefail
          git diff --exit-code 10826ba1ae624ed75c8ed5919158f7ecd81e9857 -- app/src/main/java/id/g6hifiplayer/MainActivity.kt app/src/main/cpp
          echo "MainActivity and native audio engine match Build 2.48 baseline"
      - name: Verify 2x2 runtime uses dedicated larger icons
        run: |
          set -euo pipefail
          grep -q "g6_w_ic_play_2x2" app/src/main/java/id/g6hifiplayer/G6Widgets.kt
          grep -q "g6_w_ic_pause_2x2" app/src/main/java/id/g6hifiplayer/G6Widgets.kt
          grep -q "g6_widget_btn_square_2x2" app/src/main/res/layout/g6_widget_2x2.xml
          grep -q 'android:layout_width="48dp"' app/src/main/res/layout/g6_widget_2x2.xml
          grep -q 'android:layout_gravity="bottom|start"' app/src/main/res/layout/g6_widget_2x2.xml
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK identity, size, native library, and widget registration
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK bytes: $APK_BYTES"
          test "$APK_BYTES" -lt 20000000 || { echo "APK unexpectedly large; refusing artifact"; exit 1; }
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='253' versionName='2.53.0'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libg6direct.so" || { echo "libg6direct.so is missing"; exit 1; }
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q "G6Widget4x2Provider" /tmp/manifest.txt
          grep -q "G6Widget2x2Provider" /tmp/manifest.txt
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-2.53.0-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-2.53.0-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
          echo "Verified source commit: $GITHUB_SHA"
      - name: Upload uniquely named Build 2.53 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-2.53.0-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact artifact link and build identity
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 2.53 - verified artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 2.53.0 (versionCode 253)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK filename: G6HiFiPlayer-2.53.0-${GITHUB_SHA::7}.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Player/audio engine: unchanged from Build 2.48 baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download this exact Build 2.53 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
