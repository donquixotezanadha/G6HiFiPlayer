name: G6HiFiPlayer Build 2.62 - spacing and widget opacity

on:
  workflow_dispatch:
  push:
    branches: ["build-262-widget-spacing-from-258"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify exact Build 2.58 baseline and restricted changes
        run: |
          set -euo pipefail
          BASE=ed1702c8855385dffb06c44b0f7198f3b8bc2096
          git fetch origin "$BASE"
          git diff --exit-code "$BASE" -- app/src/main/java app/src/main/cpp app/src/main/res/xml app/src/main/res/layout/g6_widget_2x2.xml app/src/main/res/drawable/g6_w_ic_play_2x2.xml app/src/main/res/drawable/g6_w_ic_pause_2x2.xml
          python3 - <<'PY'
          import subprocess
          base = "ed1702c8855385dffb06c44b0f7198f3b8bc2096"
          allowed = {
              ".github/workflows/build-262-widget-spacing-from-258.yml",
              "app/build.gradle.kts",
              "app/src/main/res/layout/g6_widget_4x1.xml",
              "app/src/main/res/drawable/g6_widget_bg_4x2.xml",
              "app/src/main/res/drawable/g6_widget_btn_square_2x2.xml",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines())
          if changed != allowed:
              raise SystemExit(f"Unexpected changed paths. Expected {sorted(allowed)}, got {sorted(changed)}")
          original = subprocess.check_output(
              ["git", "show", f"{base}:app/src/main/res/layout/g6_widget_4x1.xml"], text=True
          )
          current = open("app/src/main/res/layout/g6_widget_4x1.xml", encoding="utf-8").read()
          lines0 = original.splitlines()
          lines1 = current.splitlines()
          if len(lines0) != len(lines1):
              raise SystemExit("Layout line count changed unexpectedly")
          diffs = [(i+1, a, b) for i,(a,b) in enumerate(zip(lines0, lines1)) if a != b]
          for i, a, b in diffs:
              if i == 2 and a.startswith("<!-- Build 2.58:") and b.startswith("<!-- Build 2.62:"):
                  continue
              if a == '                android:layout_marginTop="2dp"' and b == '                android:layout_marginTop="3dp"':
                  continue
              if a == '                android:layout_marginTop="1dp"' and b == '                android:layout_marginTop="2dp"':
                  continue
              raise SystemExit(f"Unexpected layout change at line {i}: {a!r} -> {b!r}")
          if 'android:layout_width="54dp"' not in current or 'android:layout_height="54dp"' not in current:
              raise SystemExit("Album artwork dimensions changed")
          if 'android:textSize="13sp"' not in current or 'android:textSize="10sp"' not in current:
              raise SystemExit("Text sizes changed")
          if current.count('android:layout_width="36dp"') != 3 or current.count('android:layout_height="26dp"') != 4:
              raise SystemExit("Control dimensions changed")
          gradle = open("app/build.gradle.kts", encoding="utf-8").read()
          if 'versionCode = 262' not in gradle or 'versionName = "2.62.0"' not in gradle:
              raise SystemExit("Incorrect Build 2.62 version")
          for path in ("app/src/main/res/drawable/g6_widget_bg_4x2.xml",
                       "app/src/main/res/drawable/g6_widget_btn_square_2x2.xml"):
              content = open(path, encoding="utf-8").read()
              if "#B3000000" not in content:
                  raise SystemExit(f"70% opacity not set in {path}")
          print("Verified exact Build 2.58 base; only version, two target margins, two opacity drawables and workflow changed.")
          PY
      - name: Build debug APK
        run: set -o pipefail; gradle clean assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Verify APK identity and native library
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK bytes: $APK_BYTES"
          test "$APK_BYTES" -lt 20000000 || { echo "APK unexpectedly large; refusing artifact"; exit 1; }
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='262' versionName='2.62.0'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libg6direct.so" || { echo "libg6direct.so is missing"; exit 1; }
          unzip -l "$APK" | grep -q "res/layout/g6_widget_4x1.xml"
          unzip -l "$APK" | grep -q "res/layout/g6_widget_2x2.xml"
          mkdir -p verified-artifact
          cp "$APK" "verified-artifact/G6HiFiPlayer-2.62.0-${GITHUB_SHA::7}.apk"
          sha256sum "verified-artifact/G6HiFiPlayer-2.62.0-${GITHUB_SHA::7}.apk" | tee verified-artifact/SHA256SUMS.txt
          echo "Verified source commit: $GITHUB_SHA"
      - name: Upload Build 2.62 artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: G6HiFiPlayer-2.62.0-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish build summary
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        run: |
          echo "## G6HiFiPlayer Build 2.62" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: Build 2.58 (ed1702c8855385dffb06c44b0f7198f3b8bc2096)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 2.62.0 (versionCode 262)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: 4x1 progress/control spacing + 70% black opacity on both widget backgrounds" >> "$GITHUB_STEP_SUMMARY"
          echo "- Playback engine, cache, artwork, provider sizing and all other layout values preserved" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: see SHA256SUMS.txt in the artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download this exact Build 2.62 artifact ZIP]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
